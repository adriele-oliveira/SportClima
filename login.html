<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Entrar no SportClima</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/style-login.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#f27f0d',
                        'background': '#f8f7f5',
                        'on-background': '#241912',
                        'surface-1': '#121212',
                        'surface-2': '#1c1c1c',
                        'surface-3': '#252525',
                        'outline': '#8a7263',
                        'outline-variant': '#ddc1af',
                        'surface-container-low': '#f8f7f5',
                        'on-surface-variant': '#564335',
                    },
                    fontFamily: {
                        'lexend': ['Lexend', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-[#241912] dark:text-white min-h-screen flex flex-col md:flex-row overflow-hidden transition-colors duration-300">

    <section class="hidden md:flex md:w-1/2 lg:w-3/5 relative overflow-hidden">
        <img class="absolute inset-0 w-full h-full object-cover"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCF8SbrAsZd2iQCAI_Oaze1jQ1pyKehAmGBgkSRQ4yfoejKv-ZU1M4sItTnCTgTDBdYnxcKpyhTA1tiffOamEm_BTpJq6vpMGySaJwSGpo5zXv2t-w_M4G-QVKsguZ4C5ClC_IefB_egODN4-aL3-WiJzokMQ9CTn5aXFe_bR0eU74HGXpmFnoRyrYoTnOCwZueYmCNMjWwX0ly8f5FJ30XmBUcdSkEkPKXYFZDd61z8EH1Yb5nkb2DnyhiKj2H5qCFFfdjf8Kg7b4"
            alt="Atleta SportClima" />
        <div
            class="absolute inset-0 bg-gradient-to-t from-[#241912]/80 dark:from-black/90 via-transparent to-transparent transition-colors">
        </div>
        <div class="relative z-10 p-16 flex flex-col justify-end h-full">
            <span
                class="inline-block bg-[#f27f0d] text-white px-4 py-1 rounded-full text-xs font-bold uppercase mb-4 w-fit">PROJETO
                ACADÊMICO</span>
            <h1 class="text-7xl font-black text-white leading-tight">SportClima</h1>
            <p class="text-white/80 font-medium">Excelência em cada batida, precisão em cada passo.</p>
        </div>
    </section>

    <main
        class="w-full md:w-1/2 lg:w-2/5 flex items-center justify-center p-8 bg-white dark:bg-surface-1 transition-colors relative">

        <button id="dark-mode-toggle"
            class="absolute top-6 right-6 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-surface-3 transition-colors"
            aria-label="Alternar tema claro/escuro">
            <span id="dark-icon" class="material-symbols-outlined text-slate-500 dark:text-slate-400">dark_mode</span>
        </button>

        <div class="w-full max-w-md">

            <div class="mb-12">
                <span class="text-3xl font-black text-[#f27f0d] italic">SportClima</span>
                <h2 class="text-2xl font-bold mt-4 dark:text-white">Entrar no SportClima</h2>
                <p class="text-slate-500 dark:text-zinc-400">Bem-vindo de volta à sua jornada.</p>
            </div>

            <form id="login-form" class="space-y-6">

                <div>
                    <label class="text-xs font-bold uppercase text-slate-500 dark:text-zinc-400"
                        for="email">E-mail</label>
                    <input
                        class="w-full p-4 rounded-xl bg-slate-100 dark:bg-surface-2 dark:text-white border-none outline-none focus:ring-2 focus:ring-[#f27f0d]/20 transition-all mt-1.5"
                        id="email" type="email" required autofocus />
                    <p id="emailError" class="hidden text-red-500 text-xs mt-1.5 ml-1">Insira um e-mail válido.</p>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-zinc-400 ml-1"
                        for="password">Senha</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#f27f0d] transition-colors">lock</span>
                        <input
                            class="w-full pl-12 pr-12 py-4 rounded-xl border-none bg-slate-100 dark:bg-surface-2 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:ring-2 focus:ring-[#f27f0d]/20 focus:bg-white dark:focus:bg-surface-3 transition-all outline-none"
                            id="password" placeholder="••••••••" type="password" required />
                        <button type="button" id="loginPasswordToggle"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#f27f0d] transition-colors">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                    <p id="passwordError" class="hidden text-red-500 text-xs mt-1.5 ml-1">Senha obrigatória.</p>
                    <div class="flex justify-between items-center gap-3 text-xs text-slate-500 dark:text-zinc-400 mt-1">
                        <a class="font-bold text-[#f27f0d] dark:text-orange-400 hover:underline" href="#">Esqueceu a senha?</a>
                        <span>Use 8+ caracteres.</span>
                    </div>
                </div>

                <div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
                    <input id="rememberMe" type="checkbox" class="h-4 w-4 text-primary rounded border-slate-300" />
                    <label for="rememberMe" class="font-medium">Manter-me conectado</label>
                </div>

                <div class="flex gap-4 pt-2">
                    <a href="cadastro.html"
                        class="flex-1 text-center border-2 border-[#f27f0d] text-[#f27f0d] py-3 rounded-xl font-bold hover:bg-orange-50 transition-all text-sm flex items-center justify-center">
                        Criar Conta
                    </a>

                    <button
                        class="flex-1 bg-[#f27f0d] text-white py-3 rounded-xl font-bold shadow-lg shadow-[#f27f0d]/20 hover:bg-orange-600 transition-all text-sm"
                        type="submit">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/script-login.js"></script>
</body>

</html>
