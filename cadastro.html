<!DOCTYPE html>
<html class="light" lang="pt-br">

<head>
    <script>
        // Função que aplica o tema salvo IMEDIATAMENTE
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SportClima - Cadastro</title>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#f27f0d',
                        'background': '#f8f7f5',
                        'on-background': '#241912',
                        'surface-1': '#121212',
                        'surface-2': '#1c1c1c',
                        'surface-3': '#252525',
                        'outline': '#8a7263',
                        'outline-variant': '#ddc1af',
                        'surface-container-low': '#f8f7f5',
                        'on-surface-variant': '#564335',
                    },
                    fontFamily: {
                        'lexend': ['Lexend', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-background dark:bg-surface-1 text-on-background dark:text-white antialiased min-h-screen transition-colors duration-300">

    <button id="theme-toggle" type="button"
        class="fixed top-6 right-6 z-50 p-3 rounded-full bg-white dark:bg-surface-3 text-primary shadow-2xl border border-outline-variant/20 hover:scale-110 active:scale-95 transition-all flex items-center justify-center cursor-pointer">
        <span id="theme-icon" class="material-symbols-outlined text-[24px]">dark_mode</span>
    </button>

    <main class="flex min-h-screen w-full">
        <section class="relative hidden lg:flex lg:w-1/2 xl:w-3/5 overflow-hidden">
            <img class="absolute inset-0 w-full h-full object-cover"
                src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2070&auto=format&fit=crop"
                alt="Atleta" />
            <div class="absolute inset-0 bg-gradient-to-tr from-on-background/90 via-on-background/40 to-transparent">
            </div>

            <div class="relative z-10 flex flex-col justify-end p-16 h-full w-full">
                <div class="space-y-6">
                    <div
                        class="inline-flex items-center space-x-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                        <span class="text-[10px] uppercase tracking-[0.15em] font-bold text-white">PROJETO
                            ACADÊMICO</span>
                    </div>
                    <div>
                        <h1 class="text-6xl xl:text-8xl font-black text-white tracking-tighter mb-4">SportClima</h1>
                        <p class="text-xl xl:text-2xl text-white/90 max-w-lg font-light leading-relaxed">
                            Excelência em cada batida, precisão em cada passo.
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section
            class="w-full lg:w-1/2 xl:w-2/5 flex items-center justify-center p-8 sm:p-12 md:p-16 bg-white dark:bg-surface-2 transition-colors duration-300">
            <div class="w-full max-w-md space-y-10">
                <div class="space-y-2">
                    <div class="lg:hidden mb-8">
                        <span class="text-3xl font-black text-primary tracking-tighter">SportClima</span>
                    </div>
                    <h2 class="text-3xl font-bold dark:text-white tracking-tight">Crie sua conta</h2>
                    <p class="text-on-surface-variant dark:text-gray-400">Junte-se à nossa jornada de alta performance
                    </p>
                </div>

                <form id="formCadastro" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium dark:text-gray-300 ml-1" for="name">Nome
                            Completo</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
                            <input
                                class="w-full pl-12 pr-4 py-4 bg-surface-container-low dark:bg-surface-3 dark:text-white border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all"
                                id="name" placeholder="Como deseja ser chamado?" type="text" required />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium dark:text-gray-300 ml-1" for="email">E-mail</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
                            <input
                                class="w-full pl-12 pr-4 py-4 bg-surface-container-low dark:bg-surface-3 dark:text-white border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all"
                                id="email" placeholder="exemplo@email.com" type="email" required />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium dark:text-gray-300 ml-1"
                                for="password">Senha</label>
                            <input
                                class="w-full p-4 bg-surface-container-low dark:bg-surface-3 dark:text-white border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all"
                                id="password" placeholder="••••••••" type="password" required />
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-medium dark:text-gray-300 ml-1"
                                for="confirm-password">Confirmar</label>
                            <input
                                class="w-full p-4 bg-surface-container-low dark:bg-surface-3 dark:text-white border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all"
                                id="confirm-password" placeholder="••••••••" type="password" required />
                        </div>
                    </div>

                    <button
                        class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-primary/40 hover:-translate-y-0.5 active:scale-95 transition-all duration-200"
                        type="submit">
                        Criar Conta
                    </button>
                </form>

                <p class="text-center text-on-surface-variant dark:text-gray-400 text-sm">
                    Já tem uma conta? <a class="text-primary font-bold hover:underline ml-1"
                        href="login.html">Entrar</a>
                </p>
            </div>
        </section>
    </main>

    <script>
        // Esse script dentro do HTML vai forçar o funcionamento
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');

            if (!btn) {
                alert("ERRO: O botão 'theme-toggle' não foi encontrado no HTML!");
                return;
            }

            btn.addEventListener('click', () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                icon.innerText = isDark ? 'light_mode' : 'dark_mode';
                console.log("Clique detectado! Dark:", isDark);
            });

            console.log("Script interno carregado com sucesso!");
        });
    </script>
</body>
</body>

</html>
